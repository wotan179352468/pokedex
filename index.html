<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokédex — Attrape-les tous !</title>
<meta name="description" content="Retrouve les 1025 Pokémon de mémoire, en temps limité ! Succès, statistiques et défis entre amis.">
<meta property="og:title" content="Pokédex — Attrape-les tous !"><meta property="og:type" content="website">
<meta property="og:description" content="Retrouve les 1025 Pokémon de mémoire. Saurais-tu faire mieux que moi ?">
<meta property="og:image" content="https://raw.githubusercontent.com/Yarkis01/TyraDex/images/sprites/25/regular.png"><meta name="theme-color" content="#DC0A2D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔴%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#1a1a2e;--red:#DC0A2D;--dark:#171a21;--st:#1b2838;--card:#2a475e;--blue:#66c0f4;--gold:#ffd700;--green:#a4d007;--txt:#c6d4df;--lock:#4b5863;--pur:#a389d4}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:8px;color:#fff;background:var(--card);padding:.6em 1.1em}
button:hover:not(:disabled){filter:brightness(1.2)}button:disabled{opacity:.45;cursor:default}
h1,h3,h4,p{margin:0}.c{max-width:920px;margin:0 auto;padding:24px 16px;text-align:center}
.logo{font-size:clamp(2.8rem,11vw,5.5rem);color:var(--red);letter-spacing:.06em;margin:.3em 0 0;text-shadow:0 4px 0 #6d0517}
.sub{font-size:1.4rem;color:#7F8C8D;margin:.3em 0 .6em}.gold{color:#F1C40F;font-weight:700}
.menu>button{display:block;margin:12px auto;min-width:min(340px,92%)}
.big{background:var(--red);font-size:1.7rem;padding:.7em 1em;box-shadow:0 5px 0 #6d0517}
.on{background:#27ae60}.off{background:#c0392b}.steam{background:var(--st);color:var(--blue)}.vert{color:var(--green)}
.menu select{display:block;margin:12px auto;min-width:min(340px,92%);padding:.7em;border-radius:8px;border:0;background:var(--card);color:#fff;font:inherit;font-weight:700}
.small{font-size:.8rem;color:#7F8C8D;margin-top:18px}.small button{font-size:.8rem;margin:3px;background:#2C3E50}
.bar{width:min(500px,90%);height:26px;margin:20px auto 8px;background:#2C3E50;border-radius:13px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#F39C12;transition:width .2s}
/* jeu */
.top{background:var(--red);display:flex;justify-content:space-between;align-items:center;padding:10px 18px;position:sticky;top:0;z-index:5}
.top b{font-size:1.9rem;color:#fff;letter-spacing:.06em}.top button{background:#2C3E50;margin-left:6px}
.jeu{display:grid;grid-template-columns:260px 1fr;gap:12px;padding:12px;background:#A8D8A8;min-height:calc(100vh - 64px)}
.side{background:#2C3E50;border-radius:10px;padding:10px;display:flex;flex-direction:column;text-align:center;height:calc(100vh - 90px);position:sticky;top:76px}
.side h3{background:var(--st);color:#F1C40F;padding:8px;border-radius:6px;font-size:1rem}
.lst{flex:1;overflow:auto;background:#ECF0F1;color:#222;margin:8px 0;border-radius:6px;font:600 .85rem Consolas,monospace;text-align:left;user-select:none}
.lst div{padding:3px 8px;cursor:pointer;white-space:nowrap}.lst div:hover{background:#d5dbdf}
.lst .ok{background:#27ae60;color:#fff}.lst .ko{background:#c0392b;color:#fff}
.tmr{color:#F39C12;font-weight:700;font-size:1.2rem}.stop{background:#c0392b}
.det{background:#ECF0F1;color:#2C3E50;border-radius:10px;padding:16px;text-align:center}
.fb{min-height:1.6em;white-space:pre-line;font-weight:700;color:#7F8C8D;margin-bottom:10px}
.srch{display:flex;gap:8px;max-width:560px;margin:0 auto}.srch input{flex:1;min-width:0;font-size:1.2rem;padding:10px;text-align:center;border:2px solid #bdc3c7;border-radius:8px}
.srch button{background:#2C3E50}.num{font-size:1.3rem;color:#7F8C8D;margin-top:14px;min-height:1.5em}
.nom{font-size:clamp(1.8rem,6vw,2.6rem);font-weight:800;min-height:1.2em}
.spr{display:flex;justify-content:center;min-height:120px}.spr img{width:min(300px,70vw);height:min(300px,70vw);object-fit:contain;image-rendering:auto}.spr img.duo{width:min(190px,38vw);height:min(190px,38vw)}
.sta{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;max-width:520px;margin:6px auto;text-align:left}
.sr{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700}.sr span{width:54px}.sr em{flex:1;height:12px;background:#dfe6e9;border-radius:6px;overflow:hidden}.sr em i{display:block;height:100%;border-radius:6px}.sr b{width:26px;font-family:Consolas,monospace}
.tal{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}.tal span{background:#34495e;color:#fff;border-radius:10px;padding:2px 11px;font-size:.75rem;font-weight:700}.tal span.tc{background:#8e44ad}
.sug{background:#2C3E50;padding:.15em .8em;margin:0 3px;font-size:.9rem;border-radius:12px}
.sctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:900px;margin:0 auto 10px}
.sctl input,.sctl select{padding:8px 10px;border-radius:8px;border:0;background:var(--card);color:#fff;font:inherit;min-width:0}.sctl input{flex:1;min-width:170px}
.seg{display:flex;gap:2px}.seg button{border-radius:0;background:var(--card);color:var(--txt);padding:.5em .9em}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}.seg button.act{background:var(--blue);color:var(--dark)}
.swrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;max-width:900px;margin:12px auto 0;text-align:left}
.slst{max-height:68vh;margin:0!important}.slst div{display:flex;justify-content:space-between;align-items:center;padding:5px 10px}.slst b{background:rgba(0,0,0,.25);border-radius:10px;padding:0 10px}.slst .sel{outline:3px solid var(--gold);outline-offset:-3px}
.sdet{background:var(--st);border:1px solid var(--card);border-radius:10px;padding:14px;text-align:center;position:sticky;top:14px;height:fit-content}
.sdet .nom{color:#fff;font-size:1.5rem}.sdet .spr{min-height:170px}.sdet .spr img{width:170px;height:170px}.sdet p{font-size:.85rem;margin-top:4px}.dcount{font-size:1.8rem!important;font-weight:800;margin-top:8px!important}
@media(max-width:760px){.swrap{grid-template-columns:1fr}.sdet{position:static;order:-1}}
.lbl{font-size:.7rem;font-weight:700;color:#95A5A6;letter-spacing:.1em;margin-top:12px}
@media(max-width:760px){.jeu{grid-template-columns:1fr}.side{position:static;height:300px;order:2}.sta{grid-template-columns:1fr}}
/* succès / stats */
.page{background:var(--dark);min-height:100vh;padding:20px 14px 40px;text-align:center}.page h1{font-size:clamp(2rem,8vw,3rem);color:#fff}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}.tabs button{background:var(--card);color:var(--txt)}.tabs button.act{background:var(--blue);color:var(--dark)}
.pb{width:min(460px,90%);height:8px;background:var(--card);border-radius:4px;margin:8px auto 0}.pb i{display:block;height:100%;background:var(--gold);border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;max-width:980px;margin:0 auto;text-align:left}
.card{display:flex;gap:14px;align-items:center;background:var(--st);border:1px solid var(--card);border-radius:8px;padding:14px}
.ico{flex:none;width:60px;height:60px;display:grid;place-items:center;background:var(--card);color:var(--lock);font:800 1.5rem Arial;border-radius:6px}
.card h4{color:var(--lock);font-size:1rem}.card p{font-size:.8rem;margin:3px 0 5px}.card small{font-weight:700;color:var(--lock)}
.card.got{border-color:var(--gold)}.got .ico{background:var(--st);color:var(--gold)}.got h4{color:var(--gold)}.got small{color:var(--green)}
.card.ult.got{background:#2d1f3d}.ult.got h4,.ult.got small{color:#ff69b4}.card.meta.got{background:#1a3a5c;border-color:var(--blue)}.meta.got h4,.meta.got small{color:var(--blue)}
.rows{max-width:980px;margin:0 auto;text-align:left;display:grid;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--st);border:1px solid var(--card);border-radius:8px;padding:10px 14px}
.row.full{border:2px solid var(--gold)}.row.gen.full{border-color:var(--pur)}.row h4{color:#fff}.row.full h4{color:var(--gold)}.row.gen.full h4{color:var(--pur)}.row p{font-size:.8rem}.row small{font-weight:700;color:var(--green)}
.pips{display:flex;gap:6px}.pip{width:42px;height:42px;display:grid;place-items:center;background:var(--card);color:var(--lock);font:800 .8rem Arial;border-radius:5px}.pip.got{background:var(--st);color:var(--gold);border:1px solid var(--gold)}.gen .pip.got{color:var(--pur);border-color:var(--pur)}.pip.ult{color:#ff69b4!important;border-color:#ff69b4!important}
.tile{display:flex;gap:14px;align-items:center;background:var(--st);border:1px solid var(--card);border-radius:8px;padding:14px}.tile .e{font-size:2rem}.tile h4{font-size:1.4rem}.tile p{font-size:.8rem}
.tbl{max-width:560px;margin:0 auto;background:var(--st);border-radius:8px;padding:10px 16px;text-align:left;font:.95rem Consolas,monospace}.tbl div{display:flex;justify-content:space-between;padding:2px 0}
.back{margin-top:24px;background:var(--card);padding:.7em 2.4em}
/* animations */
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}60%{transform:scale(1.15)}100%{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes shine{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes flash{from{background:#ffd700}}
.pop{animation:pop .45s cubic-bezier(.3,1.5,.5,1)}.shake{animation:shake .3s}.lst .new{animation:flash 1s}
.spr{position:relative}.pt{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;pointer-events:none;animation:fly .7s ease-out forwards}
.cf{position:fixed;top:-20px;width:9px;height:14px;z-index:60;pointer-events:none;animation:fall 2.2s linear forwards}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
/* toasts */
#toasts{position:fixed;right:16px;bottom:16px;z-index:50}
.toast{background-image:linear-gradient(110deg,transparent 30%,rgba(255,215,0,.28) 50%,transparent 70%);background-size:200% 100%;display:flex;gap:12px;align-items:center;width:min(350px,92vw);background:var(--st);border:2px solid var(--gold);border-radius:8px;padding:10px 14px;animation:in .3s,shine 1.3s .3s;transition:opacity .4s}.toast.out{opacity:0}
.toast .ic{font:800 1.6rem Arial;color:var(--gold);min-width:46px;text-align:center}.toast h4{color:var(--gold)}.toast p{font-size:.8rem}
@keyframes in{from{transform:translateX(40px);opacity:0}}
</style>
</head>
<body>
<div id="app"></div><div id="toasts"></div>
<script>
const TOTAL=1025,DUREE=3600,dur=g=>g.duree||DUREE,API='https://tyradex.app/api/v1';
const SPR=n=>`https://raw.githubusercontent.com/Yarkis01/TyraDex/images/sprites/${n}/regular.png`;
const SPR2=n=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${n}.png`;
const TYPES=["Normal","Feu","Eau","Plante","Électrik","Glace","Combat","Poison","Sol","Vol","Psy","Insecte","Roche","Spectre","Dragon","Acier","Ténèbres","Fée"];
const GENS=[[1,"Kanto",1,151],[2,"Johto",152,251],[3,"Hoenn",252,386],[4,"Sinnoh",387,493],[5,"Unys",494,649],[6,"Kalos",650,721],[7,"Alola",722,809],[8,"Galar",810,905],[9,"Paldea",906,1025]];
const SEUILS=[25,50,75,100],STATS=[["hp","PV","#e74c3c"],["atk","ATQ","#e67e22"],["def","DÉF","#3498db"],["spe_atk","ATQ SPÉ","#9b59b6"],["spe_def","DÉF SPÉ","#16a085"],["vit","VIT","#f39c12"]];
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(3,'0');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(),loose=s=>norm(s).replace(/[^a-z0-9]/g,'');
const gen=n=>(GENS.find(g=>n>=g[2]&&n<=g[3])||[])[0];
const K={data:'pokedex.data.v1',badges:'pokedex.badges',stats:'pokedex.stats',opts:'pokedex.opts',game:'pokedex.game'};
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const save=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){console.warn(e)}};
const S={badges:new Set(load(K.badges,[])),stats:{parties:0,total:0,record:0,temps:0,uniques:[],type:{},gen:{},poke:{},...load(K.stats,{})},opts:{challenge:true,son:true,...load(K.opts,{})},game:load(K.game,null)};
const sg=()=>save(K.game,S.game),sb=()=>save(K.badges,[...S.badges]),ss=()=>save(K.stats,S.stats),so=()=>save(K.opts,S.opts);
const IMG=new Map();
function img(n){let i=IMG.get(n);if(!i){i=new Image();i.alt=P[n].fr;i.onerror=()=>{i.onerror=null;i.src=SPR2(n)};i.src=SPR(n);IMG.set(n,i)}return i}
function precharger(){const q=Object.keys(P).map(Number);let k=0;
  const w=()=>{if(k>=q.length)return;const i=img(q[k++]);(i.complete?Promise.resolve():new Promise(r=>{i.onload=r;i.addEventListener('error',r)})).then(()=>i.decode().catch(()=>{})).then(w)};
  for(let c=0;c<4;c++)w()}
S.opts.min??=S.opts.challenge===false?0:60;
const DFI=+((location.hash.match(/defi=(\d+)/)||[])[1]||0);
const cibleDe=s=>!s?null:s[0]=='t'?{k:'t',v:s.slice(2)}:{k:'g',v:+s.slice(2)};
const labelCible=c=>c.k=='t'?`type ${c.v}`:`génération ${c.v} (${GENS[c.v-1][1]})`;
const cibleIds=g=>Object.keys(P).map(Number).filter(n=>!g.cible||(g.cible.k=='t'?(P[n].t||[]).includes(g.cible.v):gen(n)==g.cible.v));
let P={},EX={},LO={},TT={},GT={},tm;

/* ── Sons et effets ── */
let AC;
function bip(f,d,t=0,ty='sine',v=.15){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();
  const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+t;o.type=ty;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}catch{}}
function son(k){if(!S.opts.son)return;
  if(k=='cap'){bip(660,.12,0,'square',.07);bip(990,.2,.09,'square',.07)}
  else if(k=='succes')[523,659,784,1047,1319].forEach((f,i)=>bip(f,.3,.3+i*.1,'triangle',.18));
  else if(k=='dup')bip(330,.14,0,'sine',.12);
  else if(k=='err')bip(140,.22,0,'sawtooth',.07)}
const COL=['#ffd700','#ff6b6b','#66c0f4','#a4d007','#ffffff'];
function anim(el,c){if(!el)return;el.classList.remove(c);void el.offsetWidth;el.classList.add(c);setTimeout(()=>el.classList.remove(c),1000)}
function etincelles(){const s=$('#spr');if(!s)return;for(let i=0;i<16;i++){const p=document.createElement('i'),a=Math.PI*2*i/16,d=90+Math.random()*80;p.className='pt';p.style.cssText=`--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;background:${COL[i%5]}`;s.append(p);setTimeout(()=>p.remove(),800)}}
function confettis(){for(let i=0;i<50;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${Math.random()*100}vw;background:${COL[i%5]};animation-delay:${Math.random()*.6}s;animation-duration:${1.8+Math.random()*1.2}s`;document.body.append(e);setTimeout(()=>e.remove(),3500)}}

/* ── Badges ── */
const BADGES=(()=>{const b=[];
[['premier_pas','Premier Pas','Attrape ton 1er Pokémon','1',1],['debutant','Apprenti','Attrape 10 % des Pokémon (102)','10',102],['collectionneur','Collectionneur','Attrape 25 % des Pokémon (256)','25',256],['expert','Expert','Attrape 50 % des Pokémon (512)','50',512],['maitre','Maître Dresseur','Attrape 75 % des Pokémon (768)','75',768],['legende','Légende Vivante','Attrape 100 % des Pokémon (1025)','100',1025]].forEach(([id,nom,desc,ic,s])=>b.push({id,nom,desc,ic,s,k:'p'}));
TYPES.forEach(t=>SEUILS.forEach(s=>b.push({id:`type_${loose(t)}_${s}`,nom:s==100?`Grand Maître ${t}`:`Maître ${t} ${s} %`,desc:s==100?`Trouver tous les Pokémon de type ${t}`:`Attrape ${s} % des Pokémon de type ${t}`,ic:s==100?'GM':''+s,s,k:'t',t,u:s==100})));
GENS.forEach(([g,n,d,f])=>SEUILS.forEach(s=>b.push({id:`gen_${g}_${s}`,nom:s==100?`Maître de ${n}`:`Explorateur de ${n} ${s} %`,desc:`${s==100?'Trouver tous les':`Attrape ${s} % des`} Pokémon de la génération ${g} (${n}, #${d}-${f})`,ic:s==100?'GM':''+s,s,k:'g',g,u:s==100})));
[[25,'Chasseur de Succès'],[50,'Collectionneur de Succès'],[75,'Expert des Succès'],[100,'Légende des Succès']].forEach(([s,nom])=>b.push({id:'meta_'+s,nom,desc:`Obtenir ${s} % des succès`,ic:''+s,s,k:'m'}));
return b})();

function verifier(){
  const ids=S.game.ids,tc={},gc={},nv=[];
  ids.forEach(i=>{(P[i].t||[]).forEach(t=>tc[t]=(tc[t]||0)+1);const g=gen(i);gc[g]=(gc[g]||0)+1});
  for(const b of BADGES){if(b.k=='m'||S.badges.has(b.id))continue;
    const ok=b.k=='t'?TT[b.t]&&100*(tc[b.t]||0)/TT[b.t]>=b.s:b.k=='g'?GT[b.g]&&100*(gc[b.g]||0)/GT[b.g]>=b.s:ids.length>=b.s;
    if(ok){S.badges.add(b.id);nv.push(b)}}
  const base=BADGES.filter(b=>b.k!='m'),p=100*base.filter(b=>S.badges.has(b.id)).length/base.length;
  BADGES.filter(b=>b.k=='m'&&!S.badges.has(b.id)&&p>=b.s).forEach(b=>{S.badges.add(b.id);nv.push(b)});
  if(nv.length){sb();son('succes');confettis();nv.forEach(b=>toast('Succès débloqué : '+b.nom,b.desc,b.ic))}
}
const Q=[];let busy=0;
function toast(t,d,i){Q.push([t,d,i]);if(!busy)nextToast()}
function nextToast(){const x=Q.shift();if(!x){busy=0;return}busy=1;const e=document.createElement('div');e.className='toast';e.innerHTML=`<b class=ic>${esc(x[2])}</b><div><h4>${esc(x[0])}</h4><p>${esc(x[1])}</p></div>`;$('#toasts').append(e);setTimeout(()=>e.classList.add('out'),4000);setTimeout(()=>{e.remove();setTimeout(nextToast,300)},4400)}

/* ── Données (TyraDex) mises en cache dans le navigateur ── */
async function chargerDonnees(prog){
  const c=load(K.data,null);
  if(c&&Object.keys(c).length>=TOTAL){P=c;return}
  const d={},add=j=>{if(j&&j.pokedex_id>=1&&j.pokedex_id<=TOTAL&&j.name&&j.name.fr&&j.name.en)d[j.pokedex_id]={fr:j.name.fr,en:j.name.en,t:(j.types||[]).map(t=>t.name),s:j.stats||{},a:(j.talents||[]).map(t=>({n:t.name,c:!!t.tc}))}};
  prog(5,'Téléchargement du Pokédex...');
  try{const r=await fetch(API+'/pokemon');if(r.ok)(await r.json()).forEach(add)}catch{}
  const manq=[];for(let i=1;i<=TOTAL;i++)if(!d[i])manq.push(i);
  if(manq.length){const tot=manq.length;let fait=0;
    await Promise.all(Array.from({length:10},async()=>{while(manq.length){const n=manq.pop();try{const r=await fetch(`${API}/pokemon/${n}`);if(r.ok)add(await r.json())}catch{}fait++;prog(5+90*fait/tot,`Données : ${fait}/${tot}`)}}))}
  if(!Object.keys(d).length)throw new Error('TyraDex est injoignable (vérifie ta connexion)');
  P=d;if(Object.keys(d).length>=TOTAL)save(K.data,d);
}
const FIX_TYPES={893:['Ténèbres','Plante']}; // corrections manuelles si l'API se trompe
function indexer(){
  for(const k in P){P[k].t=(P[k].t||[]).map(x=>TYPES.find(y=>norm(y)==norm(x))||x);if(FIX_TYPES[k])P[k].t=FIX_TYPES[k]}
  EX={};LO={};TT={};GT={};
  for(const [k,p] of Object.entries(P)){const id=+k;
    [p.fr,p.en].forEach(n=>{EX[norm(n)]=id;(LO[loose(n)]??=new Set()).add(id)});
    (p.t||[]).forEach(t=>TT[t]=(TT[t]||0)+1);GT[gen(id)]=(GT[gen(id)]||0)+1}
}
function rechercher(t){const e=EX[norm(t)];if(e)return[e];const l=loose(t);return l&&LO[l]?[...LO[l]].sort((a,b)=>a-b):[]} // "nidoran" -> ♀ et ♂

function finirPartie(live){
  const g=S.game;if(!g)return;
  const end=live&&!g.fin?Date.now():g.vu;let d=Math.max(0,(end-g.debut)/1000);if(g.mode=='c')d=Math.min(d,dur(g));
  const s=S.stats,u=new Set(s.uniques);
  s.parties++;s.temps+=d;s.total+=g.ids.length;s.record=Math.max(s.record,g.ids.length);
  g.ids.forEach(n=>{u.add(n);s.poke[n]=(s.poke[n]||0)+1;(P[n].t||[]).forEach(t=>s.type[t]=(s.type[t]||0)+1);const x=gen(n);s.gen[x]=(s.gen[x]||0)+1});
  s.uniques=[...u];(s.hist=s.hist||[]).push({d:Date.now(),n:g.ids.length,t:Math.round(d),m:g.mode=='c'?dur(g)/60:0,c:g.cible?labelCible(g.cible):'',i:g.indices||0});s.hist=s.hist.slice(-30);ss();S.game=null;sg();
}
const fmt=r=>{const h=Math.floor(r/3600),m=Math.floor(r%3600/60),s=r%60,z=n=>String(n).padStart(2,'0');return h?`${h}h ${z(m)}min`:m?`${m}min ${z(s)}s`:`${s}s`};
const hms=r=>{const h=Math.floor(r/3600),m=Math.floor(r%3600/60),s=r%60,z=n=>String(n).padStart(2,'0');return h?`${z(h)}:${z(m)}:${z(s)}`:`${z(m)}:${z(s)}`};

function fb(t,c){const f=$('#fb');f.textContent=t;f.style.color=c}
function liste(){const g=S.game;$('#lst').innerHTML=[...g.ids].sort((a,b)=>a-b).map(n=>`<div data-n=${n}>#${pad(n)} - ${esc(P[n].fr)}</div>`).join('');$('#cpt').textContent=`Trouvés : ${g.ids.length}/${cibleIds(g).length}`}
function lev(a,b){let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let d=p[0];p[0]=i;for(let j=1;j<=b.length;j++){const t=p[j];p[j]=Math.min(p[j]+1,p[j-1]+1,d+(a[i-1]==b[j-1]?0:1));d=t}}return p[b.length]}
function suggerer(t){
  const x=loose(t);if(x.length<3)return[];const max=Math.max(1,Math.floor(x.length/3)),best={};
  for(const k in P)for(const n of[P[k].fr,P[k].en]){const y=loose(n);if(Math.abs(y.length-x.length)>max+2&&!y.startsWith(x))continue;
    const d=y.startsWith(x)?0:lev(x,y);if(d<=max&&(best[k]==null||d<best[k]))best[k]=d}
  return Object.keys(best).sort((a,b)=>best[a]-best[b]||a-b).slice(0,3).map(Number)}
function chercher(){
  const g=S.game;if(g.fin)return;const i=$('#q'),t=i.value.trim();if(!t)return;i.value='';
  let ns=rechercher(t);if(!ns.length){fb(`« ${t} » introuvable`,'#e53935');son('err');anim(i,'shake');const s=suggerer(t);
    if(s.length){const f=$('#fb');f.append(' — tu voulais dire ');s.forEach(n=>{const b=document.createElement('button');b.className='sug';b.textContent=P[n].fr;b.onclick=()=>{$('#q').value=P[n].fr;chercher()};f.append(b)});f.append(' ?')}
    return}
  if(g.cible){const ci=new Set(cibleIds(g)),ok=ns.filter(n=>ci.has(n));if(!ok.length){fb(`${P[ns[0]].fr} ne fait pas partie du défi (${labelCible(g.cible)})`,'#ff8800');son('err');anim(i,'shake');return}ns=ok}
  const nv=ns.filter(n=>!g.ids.includes(n));
  if(nv.length){g.ids.push(...nv);g.vu=Date.now();sg();verifier()}
  const noms=ns.map(n=>P[n].fr).join(' et ');
  fb(nv.length?`${noms} ${ns.length>1?'ajoutés':'ajouté'} !`:`${noms} déjà dans la collection`,nv.length?'#2e9e4f':'#ff8800');
  montrer(ns);liste();
  if(nv.length){son('cap');etincelles();$('#spr').querySelectorAll('img').forEach(x=>anim(x,'pop'));anim($(`#lst [data-n="${nv[0]}"]`),'new')}
  else{son('dup');$('#spr').querySelectorAll('img').forEach(x=>anim(x,'shake'))}
}

}

  }
}
const SV={f:'all',o:'n',q:'',g:0,sel:0};
function liste2(){
  const s=S.stats.poke,q=norm(SV.q).replace('#',''),num=/^\d+$/.test(q);
  let ids=Object.keys(P).map(Number).filter(n=>(!SV.g||gen(n)==SV.g)&&(SV.f=='all'||(SV.f=='ok')==!!s[n])&&(!q||(num?n==+q:norm(P[n].fr).includes(q)||norm(P[n].en).includes(q))));
  ids.sort((a,b)=>SV.o=='c'?(s[b]||0)-(s[a]||0)||a-b:a-b);
  $('#scount').textContent=`${ids.length} résultat${ids.length>1?'s':''}`;
  $('#sl').innerHTML=ids.length?ids.map(n=>`<div data-n=${n} class="${s[n]?'ok':'ko'}${n==SV.sel?' sel':''}"><span>#${pad(n)} - ${esc(P[n].fr)}</span><b>${s[n]?'×'+s[n]:'—'}</b></div>`).join(''):'<div>Aucun Pokémon trouvé avec ces filtres</div>';
  if(!SV.sel||!P[SV.sel])SV.sel=ids[0]||1;detail2(SV.sel,1);
}
function detail2(n,keep){
  const c=S.stats.poke[n],i=img(n);i.className='';SV.sel=n;
  $('#dn').textContent=`#${pad(n)} ${P[n].fr}`;$('#ds').replaceChildren(i);
  $('#dt').textContent=`${(P[n].t||[]).join(' / ')||'—'} · ${(GENS.find(g=>g[0]==gen(n))||[])[1]||''}`;
  $('#dc').textContent=c?`Trouvé ×${c}`:'Jamais trouvé';$('#dc').style.color=c?'var(--green)':'#e74c3c';
  document.querySelectorAll('.slst .sel').forEach(x=>x.classList.remove('sel'));const r=$(`.slst [data-n="${n}"]`);if(r)r.classList.add('sel');
}
menu();demarrer();
