<html lang="fr">
<head>

<title>Pokédex — Attrape-les tous !</title>

<style>
:root{--bg:#1a1a2e;--red:#DC0A2D;--dark:#171a21;--st:#1b2838;--card:#2a475e;--blue:#66c0f4;--gold:#ffd700;--green:#a4d007;--txt:#c6d4df;--lock:#4b5863;--pur:#a389d4}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:8px;color:#fff;background:var(--card);padding:.6em 1.1em}
button:hover:not(:disabled){filter:brightness(1.2)}button:disabled{opacity:.45;cursor:default}
h1,h3,h4,p{margin:0}.c{max-width:920px;margin:0 auto;padding:24px 16px;text-align:center}
.logo{font-size:clamp(2.8rem,11vw,5.5rem);color:var(--red);letter-spacing:.06em;margin:.3em 0 0;text-shadow:0 4px 0 #6d0517}
.sub{font-size:1.4rem;color:#7F8C8D;margin:.3em 0 .6em}.gold{color:#F1C40F;font-weight:700}
.menu>button{display:block;margin:12px auto;min-width:min(340px,92%)}
.big{background:var(--red);font-size:1.7rem;padding:.7em 1em;box-shadow:0 5px 0 #6d0517}
.on{background:#27ae60}.off{background:#c0392b}.steam{background:var(--st);color:var(--blue)}.vert{color:var(--green)}
.menu select{display:block;margin:12px auto;min-width:min(340px,92%);padding:.7em;border-radius:8px;border:0;background:var(--card);color:#fff;font:inherit;font-weight:700}
.small{font-size:.8rem;color:#7F8C8D;margin-top:18px}.small button{font-size:.8rem;margin:3px;background:#2C3E50}
.bar{width:min(500px,90%);height:26px;margin:20px auto 8px;background:#2C3E50;border-radius:13px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#F39C12;transition:width .2s}
/* jeu */
.top{background:var(--red);display:flex;justify-content:space-between;align-items:center;padding:10px 18px;position:sticky;top:0;z-index:5}
.top b{font-size:1.9rem;color:#fff;letter-spacing:.06em}.top button{background:#2C3E50;margin-left:6px}

.lst{flex:1;overflow:auto;background:#ECF0F1;color:#222;margin:8px 0;border-radius:6px;font:600 .85rem Consolas,monospace;text-align:left;user-select:none}
.lst div{padding:3px 8px;cursor:pointer;white-space:nowrap}.lst div:not(.ok):not(.ko):hover{background:#c7d3dc}.lst .ok:hover,.lst .ko:hover{filter:brightness(1.18)}
.lst .ok{background:#27ae60;color:#fff}.lst .ko{background:#c0392b;color:#fff}
.tmr{color:#F39C12;font-weight:700;font-size:1.2rem}.stop{background:#c0392b}
.det{background:#ECF0F1;color:#2C3E50;border-radius:10px;padding:16px;text-align:center}
.fb{min-height:1.6em;white-space:pre-line;font-weight:700;color:#7F8C8D;margin-bottom:10px}
.srch{display:flex;gap:8px;max-width:560px;margin:0 auto}.srch input{flex:1;min-width:0;font-size:1.2rem;padding:10px;text-align:center;border:2px solid #bdc3c7;border-radius:8px}
.srch button{background:#2C3E50}.num{font-size:1.3rem;color:#7F8C8D;margin-top:14px;min-height:1.5em}
.nom{font-size:clamp(1.8rem,6vw,2.6rem);font-weight:800;min-height:1.2em}
.spr{display:flex;justify-content:center;min-height:120px}.spr img{width:min(300px,70vw);height:min(300px,70vw);object-fit:contain;image-rendering:auto}.spr img.duo{width:min(190px,38vw);height:min(190px,38vw)}
.sta{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;max-width:520px;margin:6px auto;text-align:left}
.sr{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700}.sr span{width:54px}.sr em{flex:1;height:12px;background:#dfe6e9;border-radius:6px;overflow:hidden}.sr em i{display:block;height:100%;border-radius:6px}.sr b{width:26px;font-family:Consolas,monospace}
.tal{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}.tal span{background:#34495e;color:#fff;border-radius:10px;padding:2px 11px;font-size:.75rem;font-weight:700}.tal span.tc{background:#8e44ad}
.sug{background:#2C3E50;padding:.15em .8em;margin:0 3px;font-size:.9rem;border-radius:12px}
.sctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:900px;margin:0 auto 10px}
.sctl input,.sctl select{padding:8px 10px;border-radius:8px;border:0;background:var(--card);color:#fff;font:inherit;min-width:0}.sctl input{flex:1;min-width:170px}
.seg{display:flex;gap:2px}.seg button{border-radius:0;background:var(--card);color:var(--txt);padding:.5em .9em}.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}.seg button.act{background:var(--blue);color:var(--dark)}
.swrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;max-width:900px;margin:12px auto 0;text-align:left}
.slst{max-height:68vh;margin:0!important}.slst div{display:flex;justify-content:space-between;align-items:center;padding:5px 10px}.slst b{background:rgba(0,0,0,.25);border-radius:10px;padding:0 10px}.slst .sel{outline:3px solid var(--gold);outline-offset:-3px}

.sdet .nom{color:#fff;font-size:1.5rem}.sdet .spr{min-height:170px}.sdet .spr img{width:170px;height:170px}.sdet p{font-size:.85rem;margin-top:4px}.dcount{font-size:1.8rem!important;font-weight:800;margin-top:8px!important}
@media(max-width:760px){.swrap{grid-template-columns:1fr}.sdet{position:static;order:-1}}
.lbl{font-size:.7rem;font-weight:700;color:#95A5A6;letter-spacing:.1em;margin-top:12px}
@media(max-width:760px){.jeu{grid-template-columns:1fr}.side{position:static;height:300px;order:2}.sta{grid-template-columns:1fr}}
/* succès / stats */
.page{background:var(--dark);min-height:100vh;padding:20px 14px 40px;text-align:center}.page h1{font-size:clamp(2rem,8vw,3rem);color:#fff}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}.tabs button{background:var(--card);color:var(--txt)}.tabs button.act{background:var(--blue);color:var(--dark)}
.pb{width:min(460px,90%);height:8px;background:var(--card);border-radius:4px;margin:8px auto 0}.pb i{display:block;height:100%;background:var(--gold);border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;max-width:980px;margin:0 auto;text-align:left}
.card{display:flex;gap:14px;align-items:center;background:var(--st);border:1px solid var(--card);border-radius:8px;padding:14px}
.ico{flex:none;width:60px;height:60px;display:grid;place-items:center;background:var(--card);color:var(--lock);font:800 1.5rem Arial;border-radius:6px}
.card h4{color:var(--lock);font-size:1rem}.card p{font-size:.8rem;margin:3px 0 5px}.card small{font-weight:700;color:var(--lock)}
.card.got{border-color:var(--gold)}.got .ico{background:var(--st);color:var(--gold)}.got h4{color:var(--gold)}.got small{color:var(--green)}
.card.ult.got{background:#2d1f3d}.ult.got h4,.ult.got small{color:#ff69b4}.card.meta.got{background:#1a3a5c;border-color:var(--blue)}.meta.got h4,.meta.got small{color:var(--blue)}
.rows{max-width:980px;margin:0 auto;text-align:left;display:grid;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--st);border:1px solid var(--card);border-radius:8px;padding:10px 14px}
.row.full{border:2px solid var(--gold)}.row.gen.full{border-color:var(--pur)}.row h4{color:#fff}.row.full h4{color:var(--gold)}.row.gen.full h4{color:var(--pur)}.row p{font-size:.8rem}.row small{font-weight:700;color:var(--green)}
.pips{display:flex;gap:6px}.pip{width:42px;height:42px;display:grid;place-items:center;background:var(--card);color:var(--lock);font:800 .8rem Arial;border-radius:5px}.pip.got{background:var(--st);color:var(--gold);border:1px solid var(--gold)}.gen .pip.got{color:var(--pur);border-color:var(--pur)}.pip.ult{color:#ff69b4!important;border-color:#ff69b4!important}
.tile{display:flex;gap:14px;align-items:center;background:var(--st);border:1px solid var(--card);border-radius:8px;padding:14px}.tile .e{font-size:2rem}.tile h4{font-size:1.4rem}.tile p{font-size:.8rem}
.tbl{max-width:560px;margin:0 auto;background:var(--st);border-radius:8px;padding:10px 16px;text-align:left;font:.95rem Consolas,monospace}.tbl div{display:flex;justify-content:space-between;padding:2px 0}
.back{margin-top:24px;background:var(--card);padding:.7em 2.4em}
/* fenêtres */
#mdl{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:40;padding:14px}
#mdl .box{background:var(--dark);border:2px solid var(--card);border-radius:12px;padding:18px;max-width:580px;width:100%;max-height:90vh;overflow:auto;text-align:center}
.box h2{margin-bottom:6px;color:#fff}.box h4{margin:12px 0 2px;color:var(--blue);font-size:.9rem;letter-spacing:.08em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0}
.chip{background:var(--card);padding:.5em .95em;border-radius:20px;border:2px solid transparent;font-size:.9rem;color:#fff;text-shadow:0 1px 2px #0008}.chip.act{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,215,0,.3);transform:scale(1.06)}
.gear{position:fixed;top:12px;right:12px;font-size:1.4rem;width:46px;height:46px;padding:0;border-radius:50%;background:var(--card);z-index:10}
.defbtn{background:linear-gradient(90deg,#8e44ad,#c0392b);font-size:1.05rem;box-shadow:0 4px 0 #4a1f5a}
/* animations */
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}60%{transform:scale(1.15)}100%{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes shine{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes flash{from{background:#ffd700}}
.pop{animation:pop .45s cubic-bezier(.3,1.5,.5,1)}.shake{animation:shake .3s}.lst .new{animation:flash 1s}
.spr{position:relative}.pt{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;pointer-events:none;animation:fly .7s ease-out forwards}
.cf{position:fixed;top:-20px;width:9px;height:14px;z-index:60;pointer-events:none;animation:fall 2.2s linear forwards}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
/* toasts */
#toasts{position:fixed;right:16px;bottom:16px;z-index:50}
.toast{background-image:linear-gradient(110deg,transparent 30%,rgba(255,215,0,.28) 50%,transparent 70%);background-size:200% 100%;display:flex;gap:12px;align-items:center;width:min(350px,92vw);background:var(--st);border:2px solid var(--gold);border-radius:8px;padding:10px 14px;animation:in .3s,shine 1.3s .3s;transition:opacity .4s}.toast.out{opacity:0}
.toast .ic{font:800 1.6rem Arial;color:var(--gold);min-width:46px;text-align:center}.toast h4{color:var(--gold)}.toast p{font-size:.8rem}
@keyframes in{from{transform:translateX(40px);opacity:0}}
/* partage + drapeaux */
.flag{width:26px;height:17px;vertical-align:-3px;border-radius:2px;margin-right:6px;box-shadow:0 0 0 1px #0004}
a.chip{text-decoration:none;display:inline-block}
.dbox{background:var(--st);border:1px solid var(--card);border-radius:10px;padding:10px;margin:8px 0;text-align:left;font-size:.85rem}.dbox summary{cursor:pointer;color:var(--blue);margin-top:6px}.dbox .sctl{margin:6px 0 0}
.sprev{width:100%;max-width:440px;display:block;border-radius:12px;box-shadow:0 6px 18px #0005;margin:10px auto}
.shp{text-align:left}.shh{display:flex;justify-content:space-between;align-items:center}.shh h2{margin:0;font-size:1.3rem}
.xbtn{background:none;color:var(--txt);font-size:1.3rem;padding:.2em .55em;border-radius:50%}
.carwrap{position:relative;margin:14px 0}.car{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;padding:4px 2px}.car::-webkit-scrollbar{display:none}
.shr{flex:none;width:74px;display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;color:var(--txt);text-decoration:none;font-size:.78rem;font-weight:400;cursor:pointer;padding:0}
.shr .ic{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;transition:transform .15s}.shr:hover .ic{transform:scale(1.1)}.ic svg{width:28px;height:28px;fill:#fff}
.arw{position:absolute;top:12px;width:38px;height:38px;border-radius:50%;background:#fff;color:#111;box-shadow:0 2px 8px #0007;padding:0;font-size:1.2rem;z-index:2}.arw.l{left:-8px}.arw.r{right:-8px}
.lkrow{display:flex;align-items:center;gap:8px;border:1px solid var(--card);border-radius:14px;padding:8px 8px 8px 14px;background:var(--st)}.lkrow input{flex:1;min-width:0;background:none;border:0;color:var(--txt);font:inherit;outline:none}
.lk2{background:none;color:var(--blue);font-weight:600;padding:.5em 0;margin-top:4px}
.scard{background:linear-gradient(135deg,#DC0A2D,#6d0517);border-radius:14px;padding:18px;color:#fff;margin:10px 0;box-shadow:0 6px 18px #0005}
.scard .sl{font-weight:800;letter-spacing:.2em;opacity:.9}.scard .sn{font-size:3.6rem;font-weight:800;color:#ffd700;line-height:1.1}.scard .sn small{font-size:1.5rem;color:#fff}.scard .ss{opacity:.9}.scard .sm{margin-top:8px;font-size:.9rem}
/* shiny */
@keyframes glow{50%{filter:drop-shadow(0 0 28px #ffd700) brightness(1.35)}}
.glow{animation:glow 1.2s}.sil{filter:brightness(0) invert(.4) opacity(.8)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;max-height:68vh;overflow:auto;user-select:none;padding:8px;margin-top:8px}
.cell{height:64px;padding:2px;background:var(--st);border:1px solid var(--card);border-radius:8px;color:var(--lock);font-size:.68rem;display:grid;place-items:center}
.cell.got{border-color:var(--gold);background:radial-gradient(circle,rgba(255,215,0,.3),var(--st) 75%)}.cell.sel{box-shadow:inset 0 0 0 3px var(--blue)}.cell:hover{border-color:var(--blue)}.cell img{max-width:100%;max-height:58px}
/* pokédex normal */
.cell{position:relative}.cell img,.cell i{pointer-events:none;-webkit-user-drag:none}
.cell.ok{border-color:var(--green);background:radial-gradient(circle,rgba(164,208,7,.22),var(--st) 75%)}
.cell .ct{position:absolute;right:3px;bottom:1px;font-size:.6rem;font-style:normal;background:#0008;color:#fff;border-radius:6px;padding:0 4px}
.cell .st{position:absolute;left:2px;top:0;font-size:.7rem;font-style:normal}
/* écran de jeu : pas de barre de défilement de page */
body.ingame{overflow:hidden}
body.ingame #app{height:100vh;display:flex;flex-direction:column}
body.ingame .top{position:static;flex:none}
body.ingame .jeu{flex:1;min-height:0;grid-template-rows:minmax(0,1fr)}
body.ingame .side{height:auto;position:static;min-height:0}
body.ingame .det{overflow-y:auto;scrollbar-width:none;min-height:0}
body.ingame .det::-webkit-scrollbar{display:none}
.jeu.fin .dex{grid-template-columns:repeat(3,1fr);max-height:none;flex:1;min-height:0;margin:8px 0;padding:6px;gap:6px;background:transparent}
.cell.ko{border-color:#e74c3c;background:radial-gradient(circle,rgba(231,76,60,.28),var(--st) 75%)}
.jeu.fin .cell{border-width:3px}.jeu.fin .cell.ok{border-color:#2ecc71;background:var(--st)}.jeu.fin .cell.ko{border-color:#e74c3c;background:var(--st)}
.jeu.fin .cell{height:auto;aspect-ratio:1;padding:3px}.jeu.fin .cell img{max-height:100%;width:100%;object-fit:contain}
@media(max-width:760px){body.ingame{overflow:auto}body.ingame #app{height:auto;display:block}body.ingame .top{position:sticky}body.ingame .jeu{grid-template-rows:auto}body.ingame .side{height:420px}}
/* thème clair */
body.light{--bg:#e9eef5;--dark:#f3f6fa;--st:#ffffff;--card:#dbe3ee;--blue:#1b6fb0;--gold:#b8860b;--green:#3a8a00;--txt:#2c3e50;--lock:#8795a5;--pur:#6c4fb3;background:#e9eef5}
body.light button{color:#2c3e50}
body.light .big,body.light .on,body.light .off,body.light .defbtn,body.light .stop,body.light .top button,body.light .srch button,body.light .sug,body.light .small button{color:#fff}
body.light .steam{color:var(--blue)}body.light .vert{color:var(--green)}
body.light .chip[style]{color:#fff;text-shadow:0 1px 2px #0008}
body.light .page h1,body.light .box h2,body.light .row h4,body.light .sdet .nom{color:#1f2d3d}
body.light .sctl input,body.light .sctl select{color:#2c3e50}
body.light .side{background:#d3deea}body.light .side h3{background:#fff;color:#2c3e50}body.light .gold{color:#b8860b}
body.light .card.ult.got{background:#f6e8fa}body.light .card.meta.got{background:#e3f0fb}
body.light .toast{box-shadow:0 4px 14px #0003}
</style>

<body>
<div id="app"></div><div id="toasts"></div>
<script>
const TOTAL=1025,DUREE=3600,dur=g=>g.duree||DUREE,API='https://tyradex.app/api/v1';
const SHINY_ODDS=100; // 1 chance sur 100 à chaque NOUVEAU Pokémon trouvé : change ce nombre pour rendre le shiny plus ou moins rare
const SPR=(n,s)=>`https://raw.githubusercontent.com/Yarkis01/TyraDex/images/sprites/${n}/${s?'shiny':'regular'}.png`;
const SPR3=n=>`https://raw.githubusercontent.com/Yarkis01/TyraDex/images/sprites/${n}/regular.png`;
const SPR2=(n,s)=>`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${s?'shiny/':''}${n}.png`;
const TYPES=["Normal","Feu","Eau","Plante","Électrik","Glace","Combat","Poison","Sol","Vol","Psy","Insecte","Roche","Spectre","Dragon","Acier","Ténèbres","Fée"];
const GENS=[[1,"Kanto",1,151],[2,"Johto",152,251],[3,"Hoenn",252,386],[4,"Sinnoh",387,493],[5,"Unys",494,649],[6,"Kalos",650,721],[7,"Alola",722,809],[8,"Galar",810,905],[9,"Paldea",906,1025]];
const SEUILS=[25,50,75,100],STATS=[["hp","PV","#e74c3c"],["atk","ATQ","#e67e22"],["def","DÉF","#3498db"],["spe_atk","ATQ SPÉ","#9b59b6"],["spe_def","DÉF SPÉ","#16a085"],["vit","VIT","#f39c12"]];
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(3,'0');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(),loose=s=>norm(s).replace(/[^a-z0-9]/g,'');
const gen=n=>(GENS.find(g=>n>=g[2]&&n<=g[3])||[])[0];
const K={data:'pokedex.data.v1',badges:'pokedex.badges',stats:'pokedex.stats',opts:'pokedex.opts',game:'pokedex.game',shiny:'pokedex.shiny'};
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const save=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){console.warn(e)}};
const S={badges:new Set(load(K.badges,[])),stats:{parties:0,total:0,record:0,temps:0,uniques:[],type:{},gen:{},poke:{},...load(K.stats,{})},opts:{challenge:true,son:true,...load(K.opts,{})},game:load(K.game,null)};
S.shiny=load(K.shiny,{});
const sg=()=>save(K.game,S.game),sb=()=>save(K.badges,[...S.badges]),ss=()=>save(K.stats,S.stats),so=()=>save(K.opts,S.opts);

async function chargerDonnees(prog){
  const c=load(K.data,null);
  if(c&&Object.keys(c).length>=TOTAL){P=c;return}
  const d={},add=j=>{if(j&&j.pokedex_id>=1&&j.pokedex_id<=TOTAL&&j.name&&j.name.fr&&j.name.en)d[j.pokedex_id]={fr:j.name.fr,en:j.name.en,t:(j.types||[]).map(t=>t.name),s:j.stats||{},a:(j.talents||[]).map(t=>({n:t.name,c:!!t.tc}))}};
  prog(5,tr('Téléchargement du Pokédex...','Downloading the Pokédex...'));
  try{const r=await fetch(API+'/pokemon');if(r.ok)(await r.json()).forEach(add)}catch{}
  const manq=[];for(let i=1;i<=TOTAL;i++)if(!d[i])manq.push(i);
  if(manq.length){const tot=manq.length;let fait=0;
    await Promise.all(Array.from({length:10},async()=>{while(manq.length){const n=manq.pop();try{const r=await fetch(`${API}/pokemon/${n}`);if(r.ok)add(await r.json())}catch{}fait++;prog(5+90*fait/tot,`${tr('Données','Data')} : ${fait}/${tot}`)}}))}

}

    body=`<div class=rows>${rangee('✨ '+tr('Shiny trouvés (total)','Shiny found (total)'),tr(`Pokémon shiny différents trouvés : ${sc.length}`,`Different shiny Pokémon found: ${sc.length}`),BADGES.filter(b=>b.k=='s'),'')}${GENS.map(([g,nm,d,f])=>rangee(`${tr('Génération','Generation')} ${g} — ${gname(g)}`,`${tr('Pokédex national','National Pokédex')} #${d}-${f} · ✨ ${sc.filter(x=>gen(x)==g).length}/${f-d+1}`,BADGES.filter(b=>b.k=='sg'&&b.g==g),'')).join('')}</div>`}
  else body=`<div class=grid>${BADGES.filter(b=>b.k==tab).map(carte).join('')}</div>`;
  vue(`<div class=page><h1>${tr('SUCCÈS','ACHIEVEMENTS')}</h1><p class=gold>🏆 ${n} / ${BADGES.length} ${tr('succès débloqués','achievements unlocked')} (${p} %)</p><div class=pb><i style="width:${p}%"></i></div>
  <div class=tabs>${cats.map(([k,l])=>`<button data-t=${k} class="${k==tab?'act':''}">${l} (${BADGES.filter(b=>inCat(b,k)&&ob(b)).length}/${BADGES.filter(b=>inCat(b,k)).length})</button>`).join('')}</div>${body}<button class=back id=bk>← ${tr('RETOUR','BACK')}</button></div>`);
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>succes(b.dataset.t));$('#bk').onclick=menu;
}
function stats(tab='a'){
  RV=()=>stats(tab);
  const s=S.stats,top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0],loc=S.opts.lang=='en'?'en-GB':'fr-FR';
  const ty=top(s.type),ge=top(s.gen),gl=g=>`${tr('Génération','Generation')} ${g} — ${gname(g)}`,cp=x=>tr(`${x} capture(s)`,`${x} catch(es)`);
  let body;
  const NS=Object.keys(S.shiny).length;
  if(tab=='s'){
    if(!pret)body=`<p id=wait data-tab=s style="margin:50px 0">⏳ ${tr('Chargement du Pokédex...','Loading the Pokédex...')}</p>`;
    else{const tot=Object.keys(P).length,pc=Math.round(100*NS/tot);
      body=`<p class=gold>✨ ${NS} / ${tot} shiny ${tr('trouvés','found')} (${pc} %)</p><div class=pb><i style="width:${Math.max(pc,NS?1:0)}%"></i></div>
      <p class=small style="margin:8px 0">${tr(`Chaque nouveau Pokémon trouvé a 1 chance sur ${SHINY_ODDS} d'être shiny.`,`Every newly found Pokémon has a 1 in ${SHINY_ODDS} chance to be shiny.`)}</p>
      <div class=sctl><select id=sg2><option value=0>${tr('Toutes les générations','All generations')}</option>${GENS.map(g=>`<option value=${g[0]} ${SV.sg==g[0]?'selected':''}>${tr('Gén.','Gen.')} ${g[0]} — ${gname(g[0])}</option>`).join('')}</select></div>
      <div class=swrap><div class=dex id=dx></div><aside class=sdet><div id=dn class=nom>&nbsp;</div><div id=ds class=spr></div><p id=dt></p><p id=dc class=dcount></p></aside></div>`}
  }else if(tab=='d'){
    if(!pret)body=`<p id=wait data-tab=d style="margin:50px 0">⏳ ${tr('Chargement du Pokédex...','Loading the Pokédex...')}</p>`;
    else{const tot=Object.keys(P).length,nb=Object.keys(P).filter(n=>s.poke[n]).length,pc=Math.round(100*nb/tot);
      body=`<p class=gold>📖 ${nb} / ${tot} ${tr('Pokémon dans ton Pokédex','Pokémon in your Pokédex')} (${pc} %)</p><div class=pb><i style="width:${Math.max(pc,nb?1:0)}%"></i></div>
      <div class=sctl style="margin-top:14px"><select id=sg3><option value=0>${tr('Toutes les générations','All generations')}</option>${GENS.map(g=>`<option value=${g[0]} ${SV.dg==g[0]?'selected':''}>${tr('Gén.','Gen.')} ${g[0]} — ${gname(g[0])}</option>`).join('')}</select>
      </div>
      <div class=swrap><div class=dex id=nx></div><aside class=sdet><div id=dn class=nom>&nbsp;</div><div id=ds class=spr></div><p id=dt></p><p id=dc class=dcount></p></aside></div>`}
  }else if(!s.parties)body=`<p style="margin:50px 0">${tr("Aucune partie jouée pour l'instant.<br>Lance une partie depuis le menu pour générer des statistiques !",'No games played yet.<br>Start a game from the menu to generate statistics!')}</p>`;
  else if(tab=='a'){
    const T=[['🎮',s.parties,tr('Parties jouées','Games played')],['✨',`${NS} / ${TOTAL}`,tr('Shiny trouvés','Shiny found')],['🏆',`${s.record} / ${TOTAL}`,tr('Record en une partie','Best in one game')],['🔴',`${s.uniques.length} / ${TOTAL}`,tr('Pokémon différents trouvés','Different Pokémon found')],['📦',s.total,tr('Captures au total (parties confondues)','Total catches (all games)')],['⏱️',fmt(s.temps),tr('Temps de jeu total','Total play time')],['✨',`${S.badges.size} / ${BADGES.length}`,tr('Succès débloqués','Achievements unlocked')],['🔥',ty?tname(ty[0]):'—',tr('Type favori','Favorite type')+(ty?` — ${cp(ty[1])}`:'')],['🗺️',ge?gl(ge[0]):'—',tr('Génération favorite','Favorite generation')+(ge?` — ${cp(ge[1])}`:'')]];
    body=`<div class=grid>${T.map(([e,v,l])=>`<div class=tile><span class=e>${e}</span><div><h4 style="color:var(--gold)">${esc(v)}</h4><p>${l}</p></div></div>`).join('')}</div>`;
  }else if(!pret)body=`<p id=wait data-tab=${tab} style="margin:50px 0">⏳ ${tr("Chargement du Pokédex... la liste s'affichera toute seule.",'Loading the Pokédex... the list will appear by itself.')}</p>`;
  else{
    const tot=Object.keys(P).length,nb=Object.keys(P).filter(n=>s.poke[n]).length,pc=Math.round(100*nb/tot),seg=(k,o)=>`<div class=seg>${o.map(([v,l])=>`<button data-seg=${k} data-v=${v} class="${SV[k]==v?'act':''}">${l}</button>`).join('')}</div>`;
    body=`<p class=gold>${nb} / ${tot} ${tr('Pokémon trouvés','Pokémon found')} (${pc} %)</p><div class=pb><i style="width:${pc}%"></i></div>
    <div class=sctl style="margin-top:14px"><input id=sq placeholder="🔍 ${tr('Nom ou numéro','Name or number')}" value="${esc(SV.q)}" autocomplete=off>
    <select id=sg><option value=0>${tr('Toutes les générations','All generations')}</option>${GENS.map(g=>`<option value=${g[0]} ${SV.g==g[0]?'selected':''}>${tr('Gén.','Gen.')} ${g[0]} — ${gname(g[0])}</option>`).join('')}</select>
    ${seg('f',[['all',tr('Tous','All')],['ok',tr('Trouvés','Found')],['ko',tr('Manquants','Missing')]])}${seg('o',[['n',tr('Par n°','By no.')],['c',tr('Plus attrapés','Most caught')]])}</div>
    <p id=scount style="font-size:.8rem"></p>
    <div class=swrap><div class="lst slst" id=sl></div><aside class=sdet><div id=dn class=nom>&nbsp;</div><div id=ds class=spr></div><p id=dt></p><p id=dc class=dcount></p></aside></div>`;
  }
  vue(`<div class=page><h1>${tr('STATISTIQUES','STATISTICS')}</h1>${s.parties||NS?`<div class=tabs>${[['a','📊 '+tr("Vue d'ensemble",'Overview')],['d','📖 '+tr('Pokémon trouvés','Found Pokémon')],['s','✨ Shiny']].map(([k,l])=>`<button data-t=${k} class="${k==tab?'act':''}">${l}</button>`).join('')}</div>`:''}${body}<button class=back id=bk>← ${tr('RETOUR','BACK')}</button></div>`);
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>stats(b.dataset.t));$('#bk').onclick=menu;
  if(tab=='d'&&$('#nx')){$('#sg3').onchange=e=>{SV.dg=+e.target.value;dexN()};
    survol($('#nx'),n=>{if(n!==SV.dd)detailN(n)});dexN()}
  if(tab=='s'&&$('#dx')){$('#sg2').onchange=e=>{SV.sg=+e.target.value;dex()};survol($('#dx'),n=>{if(n!==SV.ss)detail3(n)});dex()}
  if(tab=='c'&&$('#sl')){
    $('#sq').oninput=e=>{SV.q=e.target.value;liste2()};$('#sg').onchange=e=>{SV.g=+e.target.value;liste2()};
    document.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{SV[b.dataset.seg]=b.dataset.v;document.querySelectorAll(`[data-seg=${b.dataset.seg}]`).forEach(x=>x.classList.toggle('act',x==b));liste2()});
    survol($('#sl'),n=>{if(n!==SV.sel)detail2(n)});
    liste2();
  }
}
const SV={f:'all',o:'n',q:'',g:0,sel:0,sg:0,ss:0,dg:0,df:'all',dd:0};
function survol(box,fn){ // aperçu en cliquant, ou en glissant clic ENFONCÉ (le simple survol ne change rien)
  const at=e=>{const el=document.elementFromPoint(e.clientX,e.clientY),c=el&&el.closest?el.closest('[data-n]'):null;if(c&&box.contains(c))fn(+c.dataset.n)};
  box.onpointermove=e=>{if(e.buttons&1)at(e)};box.onpointerdown=at;box.ondragstart=e=>e.preventDefault();
  box.onclick=e=>{const c=e.target.closest('[data-n]');if(c)fn(+c.dataset.n)};
}
function dexN(){
  const s=S.stats.poke,ids=Object.keys(P).map(Number).filter(n=>(!SV.dg||gen(n)==SV.dg));
  if(!ids.length){$('#nx').innerHTML=`<p style="grid-column:1/-1;padding:20px">${tr('Aucun Pokémon avec ce filtre','No Pokémon match this filter')}</p>`;return}
  $('#nx').innerHTML=ids.map(n=>`<button class="cell${s[n]?' ok':''}${n==SV.dd?' sel':''}" data-n=${n}${s[n]?` title="${esc(pn(n))}"`:''}>${s[n]?`<img src="${SPR(n)}" loading=lazy alt="" onerror="this.onerror=null;this.src=SPR2(${n})">${s[n]>1?`<i class=ct>×${s[n]}</i>`:''}${S.shiny[n]?'<i class=st>✨</i>':''}`:`<img class=sil src="${SPR(n)}" loading=lazy alt="" onerror="this.onerror=null;this.src=SPR2(${n})">`}</button>`).join('');
  detailN(ids.includes(SV.dd)?SV.dd:(ids.find(n=>s[n])||ids[0]));
}
function detailN(n){
  SV.dd=n;const c=S.stats.poke[n];let i;
  if(c){i=img(n);i.className=''}else{i=new Image();i.src=SPR(n);i.className='sil'}
  $('#dn').textContent=`#${pad(n)} ${c?pn(n):'???'}`;$('#ds').replaceChildren(i);
  $('#dt').textContent=c?`${(P[n].t||[]).map(tname).join(' / ')||'—'} · ${gname(gen(n))||''}${S.shiny[n]?' · ✨ shiny ×'+S.shiny[n]:''}`:'';
  $('#dc').textContent=c?tr(`Trouvé ×${c}`,`Found ×${c}`):tr('Jamais trouvé','Never found');$('#dc').style.color=c?'var(--green)':'var(--lock)';
  document.querySelectorAll('#nx .sel').forEach(x=>x.classList.remove('sel'));const r=$(`#nx [data-n="${n}"]`);if(r)r.classList.add('sel');
}
function dex(){
  const ids=Object.keys(P).map(Number).filter(n=>!SV.sg||gen(n)==SV.sg);
  $('#dx').innerHTML=ids.map(n=>S.shiny[n]?`<button class="cell got${n==SV.ss?' sel':''}" data-n=${n} title="${esc(pn(n))}"><img src="${SPR(n,true)}" loading=lazy alt="" onerror="this.onerror=null;this.src=SPR2(${n},true)"></button>`:`<button class="cell${n==SV.ss?' sel':''}" data-n=${n}>#${pad(n)}</button>`).join('');
  detail3(ids.includes(SV.ss)?SV.ss:(ids.find(n=>S.shiny[n])||ids[0]||1));
}
function detail3(n){
  SV.ss=n;const c=S.shiny[n];let i;
  if(c)i=img(n,true);else{i=new Image();i.src=SPR(n);i.className='sil'}
  if(c)i.className='';
  $('#dn').textContent=`#${pad(n)} ${c?pn(n):'???'}`;$('#ds').replaceChildren(i);
  $('#dt').textContent=c?`${(P[n].t||[]).map(tname).join(' / ')||'—'} · ${gname(gen(n))||''}`:'';
  $('#dc').textContent=c?`✨ ${tr('Trouvé','Found')} ×${c}`:tr('Pas encore de shiny','No shiny yet');$('#dc').style.color=c?'var(--gold)':'var(--lock)';
  document.querySelectorAll('#dx .sel').forEach(x=>x.classList.remove('sel'));const r=$(`#dx [data-n="${n}"]`);if(r)r.classList.add('sel');
}
function liste2(){
  const s=S.stats.poke,q=norm(SV.q).replace('#',''),num=/^\d+$/.test(q);
  let ids=Object.keys(P).map(Number).filter(n=>(!SV.g||gen(n)==SV.g)&&(SV.f=='all'||(SV.f=='ok')==!!s[n])&&(!q||(num?n==+q:norm(P[n].fr).includes(q)||norm(P[n].en).includes(q))));
  ids.sort((a,b)=>SV.o=='c'?(s[b]||0)-(s[a]||0)||a-b:a-b);
  $('#scount').textContent=tr(`${ids.length} résultat${ids.length>1?'s':''}`,`${ids.length} result${ids.length>1?'s':''}`);
  $('#sl').innerHTML=ids.length?ids.map(n=>`<div data-n=${n} class="${s[n]?'ok':'ko'}${n==SV.sel?' sel':''}"><span>#${pad(n)} - ${esc(pn(n))}</span><b>${s[n]?'×'+s[n]:'—'}</b></div>`).join(''):`<div>${tr('Aucun Pokémon trouvé avec ces filtres','No Pokémon match these filters')}</div>`;
  if(!SV.sel||!P[SV.sel])SV.sel=ids[0]||1;detail2(SV.sel,1);
}
function detail2(n,keep){
  const c=S.stats.poke[n],i=img(n);i.className='';SV.sel=n;
  $('#dn').textContent=`#${pad(n)} ${pn(n)}`;$('#ds').replaceChildren(i);
  $('#dt').textContent=`${(P[n].t||[]).map(tname).join(' / ')||'—'} · ${gname(gen(n))||''}`;
  $('#dc').textContent=c?tr(`Trouvé ×${c}`,`Found ×${c}`):tr('Jamais trouvé','Never found');$('#dc').style.color=c?'var(--green)':'#e74c3c';
  document.querySelectorAll('.slst .sel').forEach(x=>x.classList.remove('sel'));const r=$(`.slst [data-n="${n}"]`);if(r)r.classList.add('sel');
}
menu();demarrer();
</script>
</body>
